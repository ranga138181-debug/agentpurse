services:
  - type: web
    name: agentpurse
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # The free plan has no confirmed pre-deploy step, so migrations run first; a failure stops the start.
    startCommand: node scripts/migrate.mjs && pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentpurse-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false

databases:
  - name: agentpurse-db
    plan: free
    region: oregon
