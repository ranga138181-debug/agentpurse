name: e2e

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  e2e:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentpurse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentpurse_test
      # Placeholder for the throwaway CI server, not a credential.
      SESSION_SECRET: "00000000000000000000000000000000"
      APP_URL: http://localhost:3000
      RENDER_GIT_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      AI_PROVIDER: fake
      PAYPAL_ENV: sandbox
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: placeholder
      DAILY_MANDATE_CAP: "500"
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_BUYER_EMAIL: ${{ secrets.PAYPAL_BUYER_EMAIL }}
      PAYPAL_BUYER_PASSWORD: ${{ secrets.PAYPAL_BUYER_PASSWORD }}
      # Enables the live product source and E2E-011; empty when the secret is not set.
      CHANNEL3_API_KEY: ${{ secrets.CHANNEL3_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: IT-PAY-010 sandbox contract test
        env:
          PAYPAL_CONTRACT_TEST: "1"
        run: pnpm exec vitest run --project integration tests/integration/paypal-sandbox.test.ts
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
